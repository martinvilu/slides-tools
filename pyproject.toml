[project]
name = "slide-tools"
version = "1.2.0"
description = "Sistema de control remoto y telemetría para Google Slides mediante WebExtensions y daemon concentrador local/LAN."
readme = "README.md"
authors = [
    { name = "Martín René", email = "martinvilu@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "websockets>=12.0",
]

[project.scripts]
slide-tools = "slide_tools.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slide_tools"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
