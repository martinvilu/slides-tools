[project]
name = "slide-tools"
version = "1.2.0"
description = "Sistema de control remoto y telemetría para Google Slides mediante WebExtensions y daemon concentrador local/LAN."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pydantic>=2.0.0",
    "qrcode>=8.2",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "websockets>=12.0",
    "zeroconf>=0.151.3",
]

[project.scripts]
slide-tools = "slide_tools.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slide_tools"]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/slide-tools"
Repository = "https://github.com/INGCOM-UNRN-P1/slide-tools.git"
Issues = "https://github.com/INGCOM-UNRN-P1/slide-tools/issues"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]